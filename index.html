<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>
<style>
body {
 font-family: Arial, sans-serif;
 background: #f4f7fb;
}
h1 {
 text-align: center;
 background: #2a72d4;
 color: white;
 padding: 20px;
}
.container {
 width: 90%;
 max-width: 500px;
 margin: 30px auto;
 background: white;
 padding: 25px;
 border-radius: 12px;
}
.item {
 display: flex;
 justify-content: space-between;
 margin: 12px 0;
 font-size: 18px;
}
input[type="number"] {
 width: 70px;
 text-align: center;
}

/* ✅ NOVÁ VSTUPNÍ POLE */
input[type="text"] {
 width: 100%;
 padding: 10px;
 margin-top: 10px;
 border-radius: 8px;
 border: 1px solid #ccc;
}

#celkem, #pocet {
 text-align: center;
 font-size: 22px;
 margin-top: 15px;
 font-weight: bold;
 color: #2a72d4;
}
button {
 width: 100%;
 padding: 15px;
 margin-top: 30px;
 font-size: 24px;
 background: #ff6b35;
 color: white;
 border: none;
 border-radius: 10px;
 cursor: pointer;
}
button:hover {
 background: #e85a28;
}
</style>
</head>
<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

 <!-- ✅ POLOŽKY -->
 <div id="items"></div>

 <div id="celkem">Celková cena: 0 Kč</div>
 <div id="pocet">Počet kusů: 0</div>

 <!-- ✅ NOVÁ POLE (POVINNÁ) -->
 <input type="text" id="jmeno" placeholder="Vaše jméno (Novák Jan)" required>
 <input type="text" id="telefon" placeholder="Telefon (+420 000 000 000)" required>

 <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>
let items = [];

// Načítání CSV
async function loadCSV() {
 try {
 const response = await fetch("data_bufet.csv?t=" + Date.now());
 const text = await response.text();
 parseCSV(text);
 renderItems();
 } catch (err) {
 alert("Chyba načítání CSV.");
 }
}

// Parsování CSV
function parseCSV(text) {
 items = [];
 const lines = text.split("\n");

 for (let i = 1; i < lines.length; i++) {
 const line = lines[i].trim();
 if (!line) continue;

 const [nazev, cena] = line.split(";");
 items.push({
 nazev: nazev.trim(),
 cena: parseFloat(cena),
 mnozstvi: 0
 });
 }
}

// Vykreslení
function renderItems() {
 const container = document.getElementById("items");
 container.innerHTML = "";

 items.forEach((item, index) => {
 const div = document.createElement("div");
 div.className = "item";

 div.innerHTML = `
 <span>${item.nazev} (${item.cena} Kč)</span>
 <input type="number" min="0" value="0"
 onchange="updateItem(${index}, this.value)">
 `;

 container.appendChild(div);
 });
}

// Aktualizace položky
function updateItem(index, value) {
 items[index].mnozstvi = parseInt(value) || 0;
 updateSummary();
}

// Přepočet
function updateSummary() {
 let celkem = 0;
 let pocet = 0;

 items.forEach(item => {
 celkem += item.cena * item.mnozstvi;
 pocet += item.mnozstvi;
 });

 document.getElementById("celkem").innerText =
 "Celková cena: " + celkem.toFixed(2) + " Kč";

 document.getElementById("pocet").innerText =
 "Počet kusů: " + pocet;
}

/* ✅ FUNKCE MAILTO – GENERUJE E-MAIL */
function odeslatObjednavku() {

 const jmeno = document.getElementById("jmeno").value.trim();
 const telefon = document.getElementById("telefon").value.trim();

 // ✅ VALIDACE
 if (!jmeno || jmeno.split(" ").length < 2) {
 alert("Zadejte jméno ve formátu: Příjmení Jméno");
 return;
 }

 if (!telefon) {
 alert("Zadejte telefon.");
 return;
 }

 const objednane = items.filter(item => item.mnozstvi > 0);

 if (objednane.length === 0) {
 alert("Nevybral jsi žádné položky!");
 return;
 }

 let body = "Objednávka bufet:\n\n";
 body += "Jméno: " + jmeno + "\n";
 body += "Telefon: " + telefon + "\n\n";

 let celkem = 0;
 let pocet = 0;

 objednane.forEach(item => {
 let cena = item.cena * item.mnozstvi;
 body += `${item.nazev} - ${item.mnozstvi} ks - ${cena} Kč\n`;

 celkem += cena;
 pocet += item.mnozstvi;
 });

 body += "\nCelkem kusů: " + pocet;
 body += "\nCelková cena: " + celkem.toFixed(2) + " Kč";

 /* ✅ MAILTO (OTEVŘENÍ E-MAILU) */
 const mailtoLink =
 `mailto:stefkova.lucie@kostka-skola.cz?subject=${encodeURIComponent("Objednávka bufet")}&body=${encodeURIComponent(body)}`;

 window.location.href = mailtoLink;
}

// Start
loadCSV();

</script>

</body>
</html>
